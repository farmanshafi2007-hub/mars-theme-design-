<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redline — Mars Trips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <style>
    :root{
      --red:#ff1e38;
      --red-glow:rgba(255,30,56,0.65);
      --deep:#180602;
      --amber:#ff8e3c;
      --gold:#ffe1a8;
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
    html,body{height:100%;overflow:hidden;background:var(--deep);color:#fff;font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    input{font:inherit;color:inherit}

    /* High contrast, ultra-vibrant backdrop */
    .hero{
      position:fixed;
      inset:0;
      overflow:hidden;
      background:radial-gradient(65% 78% at 50% 46%, #e34c10 0%, #aa2f08 30%, #531404 65%, #180501 100%);
    }
    .hero>*{position:absolute}

    #word0{
      left:50%;top:50%;
      font-weight:900;
      font-size:min(27vw,48vh);
      line-height:.8;
      letter-spacing:-.04em;
      white-space:nowrap;
      z-index:2;
      will-change:transform,clip-path,opacity;
      text-shadow:0 10px 40px rgba(0,0,0,0.55), 0 0 80px rgba(255,142,60,0.22);
      filter:drop-shadow(0 0 25px rgba(255,70,30,0.2));
    }
    #eyebrow{
      left:50%;top:50%;
      z-index:3;
      font-weight:400;
      font-size:clamp(13px,1.35vw,22px);
      letter-spacing:.22em;
      text-transform:uppercase;
      white-space:nowrap;
      text-shadow:0 2px 14px rgba(0,0,0,0.8);
      color:#ffded4;
    }
    #gl{inset:0;width:100%;height:100%;z-index:4;cursor:grab;touch-action:none}
    #gl.drag{cursor:grabbing}
    #dust{inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

    /* Enhanced brilliant flare with corona rays */
    #flare{
      z-index:1;
      width:52vmin;
      height:52vmin;
      margin:-26vmin;
      border-radius:50%;
      pointer-events:none;
      background:radial-gradient(closest-side, rgba(255,255,240,1) 0%, rgba(255,214,140,0.88) 22%, rgba(255,130,45,0.45) 54%, rgba(255,60,10,0.12) 78%, transparent 100%);
      filter:blur(3px);
      box-shadow:0 0 100px 30px rgba(255,140,40,0.45);
    }

    #pin{
      z-index:6;left:0;top:0;
      display:flex;align-items:center;gap:11px;
      font-weight:700;font-size:11px;letter-spacing:.2em;
      text-transform:uppercase;pointer-events:none;white-space:nowrap;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.9));
      color:#fff;
    }
    #pin i{
      width:13px;height:13px;border-radius:50%;background:#fff;position:relative;
      box-shadow:0 0 0 4px var(--red), 0 0 20px var(--red);
    }
    #pin i::after{
      content:"";position:absolute;inset:-15px;border-radius:50%;
      border:1.5px solid #fff;animation:pulse 2s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    }
    @keyframes pulse{from{transform:scale(.35);opacity:1}to{transform:scale(1.6);opacity:0}}

    #word1{
      left:50%;top:0;z-index:6;font-weight:900;
      font-size:min(10vw,20vh);letter-spacing:-.025em;line-height:1;
      color:rgba(255,255,255,.88);pointer-events:none;white-space:nowrap;
      text-shadow:0 20px 50px rgba(10,2,0,.9), 0 0 60px rgba(255,30,60,.35);
    }

    #sites{
      right:5.5%;top:50%;z-index:7;list-style:none;
      display:grid;gap:clamp(26px,5.5vh,54px);
      transform:translateY(-50%);
    }
    #sites::before{
      content:"";position:absolute;right:6px;top:4px;bottom:4px;width:2px;
      background:linear-gradient(to bottom, transparent, rgba(255,255,255,.6) 15%, rgba(255,255,255,.6) 85%, transparent);
    }
    #sites li{
      position:relative;text-align:right;padding-right:32px;cursor:pointer;
      font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
      transition:all .35s cubic-bezier(0.2, 0.8, 0.2, 1);
      color:rgba(255,230,220,0.7);
      text-shadow:0 2px 8px rgba(0,0,0,0.7);
    }
    #sites li:hover{color:#fff;transform:translateX(-4px)}
    #sites li::after{
      content:"";position:absolute;right:2px;top:50%;width:10px;height:10px;margin-top:-5px;
      border-radius:50%;background:#ffded4;transition:all .35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow:0 0 10px rgba(255,255,255,0.4);
    }
    #sites li.on{
      font-size:15.5px;color:#fff;
      font-weight:800;
    }
    #sites li.on::after{
      background:#fff;
      transform:scale(1.65);
      box-shadow:0 0 0 6px var(--red-glow), 0 0 18px var(--red);
    }

    #card{
      right:calc(5.5% + 210px);top:0;z-index:7;
      width:clamp(190px,16vw,270px);aspect-ratio:1.42;
      background-repeat:no-repeat;border-radius:6px;
      box-shadow:0 28px 60px rgba(10,1,0,.85), 0 0 0 1px rgba(255,255,255,0.18);
      overflow:visible;
      transition:transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      background-color:#1c0804;
    }
    #card a{
      position:absolute;left:-22px;bottom:16%;
      background:var(--red);color:#fff;
      font-weight:700;font-size:11px;letter-spacing:.14em;
      text-transform:uppercase;padding:10px 18px;border-radius:3px;
      box-shadow:0 10px 24px var(--red-glow);
      transition:transform .2s, background .2s, box-shadow .2s;
    }
    #card a:hover{
      background:#ff334b;
      transform:scale(1.05) translateX(3px);
      box-shadow:0 14px 30px rgba(255,30,56,0.9);
    }

    #region{
      left:50%;top:50%;z-index:7;
      transform:translate(-50%,-50%);
      font-weight:700;font-size:clamp(30px,4.2vw,64px);
      letter-spacing:.08em;pointer-events:none;
      text-shadow:0 0 45px rgba(255,30,60,.9), 0 4px 20px rgba(0,0,0,.9);
      color:#fff;
    }

    /* Photo canyon landscape with maximum depth and contrast */
    #land,#fore{inset:0;background-size:cover;background-repeat:no-repeat}
    #land{
      z-index:8;background-position:50% 60%;
      will-change:transform;
      filter:contrast(1.2) brightness(1.08) saturate(1.15);
    }
    #dest{left:0;right:0;top:0;z-index:9;text-align:center;pointer-events:none}
    #dest small{
      display:block;font-weight:400;font-size:min(4.8vw,9.5vh);
      line-height:1;letter-spacing:.12em;text-transform:uppercase;
      opacity:.95;color:#ffd8c0;
      text-shadow:0 4px 20px rgba(30,5,0,.9);
    }
    #dest b{
      display:block;margin-top:.08em;font-weight:900;
      font-size:min(9.5vw,19.5vh);line-height:1;letter-spacing:-.03em;
      text-transform:uppercase;white-space:nowrap;
      color:#fff8f0;
      text-shadow:0 8px 45px rgba(20,2,0,.95), 0 0 70px rgba(255,140,50,.35);
    }
    #fore{
      z-index:10;background-position:50% 100%;
      will-change:transform;
      filter:contrast(1.28) brightness(1.04) saturate(1.2);
    }
    #fog{
      inset:0;z-index:11;pointer-events:none;
      background:radial-gradient(75% 70% at 50% 46%, #ffe9d1 0%, #f7cb9a 48%, #aa541c 100%);
    }

    #scrim{
      left:0;right:0;top:0;height:180px;z-index:13;pointer-events:none;
      background:linear-gradient(rgba(24,5,1,.85) 0%, rgba(24,5,1,.3) 65%, transparent 100%);
    }

    /* Enhanced floating booking dock */
    #bar{
      left:50%;bottom:6.5vh;z-index:12;
      width:min(90vw,960px);
      display:grid;grid-template-columns:1.1fr 1.1fr 1fr 76px;
      background:rgba(255,255,255,0.98);
      color:#25130b;border-radius:6px;
      box-shadow:0 30px 80px rgba(12,2,0,.75), 0 0 0 1px rgba(255,255,255,0.3);
      backdrop-filter:blur(16px);
      transform:translateX(-50%);
      transition:box-shadow .3s, transform .2s ease;
    }
    #bar:hover{
      box-shadow:0 35px 95px rgba(12,2,0,.85), 0 0 25px rgba(255,80,30,0.25);
    }
    #bar div{padding:16px 24px;border-right:1px solid #ebd8cb;position:relative}
    #bar label{display:block;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8f7566}
    #bar input{
      width:100%;margin-top:5px;border:0;outline:0;
      font:700 15.5px Montserrat,sans-serif;color:#201008;background:none;
    }
    #bar button{
      background:var(--red);color:#fff;border-radius:0 6px 6px 0;
      font-size:24px;transition:all .25s;display:grid;place-items:center;
      position:relative;overflow:hidden;
    }
    #bar button:hover{
      background:#ff0f2b;
      box-shadow:inset 0 0 20px rgba(255,255,255,0.3);
    }
    #bar button:active{transform:scale(0.96)}

    /* Chrome Navigation */
    header{
      left:0;right:0;top:0;z-index:20;display:flex;align-items:center;
      padding:clamp(20px,3.5vh,36px) clamp(24px,3.2vw,50px);
      font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
      pointer-events:none;
    }
    header>*{pointer-events:auto}
    .logo{
      display:flex;align-items:center;gap:13px;margin-right:auto;
      font-weight:900;font-size:21px;letter-spacing:-.02em;text-transform:none;
      filter:drop-shadow(0 2px 10px rgba(0,0,0,0.6));
    }
    .logo svg{width:36px;height:32px;filter:drop-shadow(0 0 10px rgba(255,255,255,0.4))}
    header a{
      margin-left:clamp(18px,2.8vw,42px);opacity:.85;transition:opacity .2s, color .2s;
      text-shadow:0 2px 8px rgba(0,0,0,0.7);
    }
    header a:hover{opacity:1;color:#ffe2d4}
    .ico{
      width:42px;height:42px;margin-left:clamp(16px,2.4vw,36px);border-radius:50%;
      display:grid;place-items:center;background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(8px);
      transition:all .25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ico:hover{background:rgba(255,255,255,.32);transform:scale(1.08)}
    .ico svg,.srch svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
    .srch{
      margin-left:clamp(18px,2.8vw,40px);display:grid;place-items:center;cursor:pointer;
      opacity:.85;transition:all .2s;
    }
    .srch:hover{opacity:1;transform:scale(1.1)}
    
    #rail{left:clamp(22px,3vw,48px);top:50%;z-index:20;display:grid;gap:18px;transform:translateY(-50%)}
    #rail button{
      width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);
      border:1px solid rgba(255,255,255,.25);
      transition:all .35s cubic-bezier(0.2, 0.8, 0.2, 1);
      position:relative;
    }
    #rail button::before{
      content:"";position:absolute;inset:-8px;border-radius:50%;
    }
    #rail button:hover{background:rgba(255,255,255,.7);transform:scale(1.2)}
    #rail button.on{
      background:#fff;transform:scale(1.45);
      box-shadow:0 0 14px #fff, 0 0 0 4px rgba(255,255,255,.25);
    }
    
    #hint{
      left:50%;bottom:4.2vh;transform:translateX(-50%);z-index:7;
      font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
      opacity:.85;white-space:nowrap;pointer-events:none;color:#ffdec8;
      text-shadow:0 2px 10px rgba(0,0,0,0.85);
      transition:opacity .3s;
    }

    /* Toast Notification for full interactivity */
    #toast{
      position:fixed;top:32px;left:50%;transform:translate(-50%, -100px);
      z-index:100;background:rgba(20,5,2,0.92);color:#fff;
      padding:14px 28px;border-radius:40px;font-size:13px;font-weight:600;letter-spacing:.08em;
      border:1px solid rgba(255,255,255,0.2);box-shadow:0 15px 40px rgba(0,0,0,0.6);
      backdrop-filter:blur(12px);transition:transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      pointer-events:none;opacity:0;
    }
    #toast.show{transform:translate(-50%, 0);opacity:1}

    /* Responsive Adaptation */
    @media (max-width:880px){
      header a:not(.logo){display:none}
      #word0{font-size:28vw}
      #eyebrow{font-size:12px;letter-spacing:.15em}
      #word1{font-size:16vw}
      #sites{right:16px;top:auto;bottom:10vh;transform:none;gap:18px}
      #sites li{font-size:11px;padding-right:24px}
      #sites li.on{font-size:13.5px}
      #card{right:auto;left:16px;top:auto!important;bottom:10vh;width:44vw;max-width:230px}
      #card a{left:6px;bottom:6px;padding:7px 12px;font-size:9.5px}
      #dest b{font-size:11.5vw}
      #dest small{font-size:6.5vw}
      #bar{
        grid-template-columns:1fr 1fr;
        width:calc(100vw - 32px);
        bottom:3.2vh;
        border-radius:8px;
      }
      #bar div:nth-child(2){border-right:0}
      #bar div{padding:10px 14px;border-bottom:1px solid #ebd8cb}
      #bar div:nth-child(3){border-bottom:0}
      #bar button{height:52px;border-radius:0 0 8px 0}
      #hint,#rail{display:none}
      #fore{background-size:210% auto}
    }

    @media (max-width:480px){
      #card{width:50vw}
      #bar{grid-template-columns:1fr;bottom:2vh}
      #bar div{border-right:0}
      #bar button{border-radius:0 0 8px 8px;height:48px}
    }
  </style>
</head>
<body>
  <div id="toast">Seats reserved for Olympus Mons. Redline departure confirmed.</div>

  <main class="hero" id="hero">
    <div id="word0">MARS</div>
    <div id="eyebrow">Book your seat to</div>
    <div id="flare"></div>
    <canvas id="gl"></canvas>
    <canvas id="dust"></canvas>
    <div id="pin"><i></i><span>Tharsis</span></div>
    <div id="word1">THARSIS</div>
    <ul id="sites"></ul>
    <div id="card"><a href="#" id="explore">Explore</a></div>
    <div id="region">THARSIS</div>
    <div id="land"></div>
    <div id="dest"><small>Tharsis</small><b id="destName">Olympus Mons</b></div>
    <div id="fore"></div>
    <div id="fog"></div>
    <div id="scrim"></div>
    <form id="bar" onsubmit="return false">
      <div><label for="d1">Depart Earth</label><input id="d1" value="12 Mar 2041"></div>
      <div><label for="d2">Return</label><input id="d2" value="30 Sep 2042"></div>
      <div><label for="d3">Passengers</label><input id="d3" value="2 adults"></div>
      <button id="bookBtn" aria-label="Search seats">→</button>
    </form>
    <header>
      <a class="logo" href="#" id="home" style="margin-left:0;opacity:1">
        <svg viewBox="0 0 34 30" fill="none" stroke="#fff" stroke-linecap="round">
          <path stroke-width="3.2" d="M3 27C5 13 15 4 31 3"/>
          <path stroke-width="2" d="M11 27c1.500-8 8-14 18-15"/>
          <circle cx="30" cy="20" r="3.500" fill="#fff" stroke="none"/>
        </svg>
        Redline
      </a>
      <a href="#" id="loginLink">Login</a>
      <a href="#" id="signupLink">Sign up</a>
      <span class="srch" id="srchBtn" title="Search destinations">
        <svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6.500"/><path d="m15.500 15.500 5 5"/></svg>
      </span>
      <button class="ico" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M5 8h14M7 12h10M5 16h14"/></svg>
      </button>
    </header>
    <div id="rail">
      <button aria-label="Mars" class="on"></button>
      <button aria-label="Tharsis"></button>
      <button aria-label="Destination"></button>
    </div>
    <div id="hint">Drag to spin · click the planet to land</div>
  </main>

  <script type="module">
    import * as THREE from 'three';

    // 1. Assets
    const P = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_';
    const MAP = P + '20261031_030432_a1948696-c1d5-4468-845e-7d1291f80943.png&w=2688&q=92';
    const LAND = P + '20261031_030420_da39d0cf-af67-4e33-a487-6469549cfbff.png&w=2400&q=88';
    const FORE = P + '20261031_030420_fe406b69-3e6f-4b7c-a17e-ef09db0d270b.png&w=2400&q=88';
    const CARDS = P + '20261031_030420_e222aa05-c121-4f31-a466-0321badc0e28.png&w=1400&q=85';

    // Set background images
    const elLand = document.getElementById('land');
    const elFore = document.getElementById('fore');
    const elCard = document.getElementById('card');
    elLand.style.backgroundImage = `url('${LAND}')`;
    elFore.style.backgroundImage = `url('${FORE}')`;
    elCard.style.backgroundImage = `url('${CARDS}')`;

    // 4. Data
    const SHEET = {w: 2336, h: 1744};
    const SITES = [
      {name: 'Olympus Mons', u: .121, v: .31, box: [0, 0, 1150, 810]},
      {name: 'Valles Marineris', u: .45, v: .56, box: [1186, 0, 1150, 810]},
      {name: 'Gale Crater', u: .85, v: .75, box: [0, 900, 1150, 810]},
      {name: 'Jezero Delta', u: .61, v: .35, box: [1186, 900, 1150, 810]}
    ];
    const THARSIS = {u: .15, v: .41};

    function mapDir(u, v) {
      const ph = 2 * Math.PI * u;
      const th = Math.PI * v;
      return new THREE.Vector3(
        -Math.cos(ph) * Math.sin(th),
        Math.cos(th),
        Math.sin(ph) * Math.sin(th)
      );
    }
    function faceYaw(d) { return Math.atan2(-d.x, d.z); }
    function faceLat(d) { return Math.asin(d.y); }

    const tharsisDir = mapDir(THARSIS.u, THARSIS.v);
    const tharsisYaw = faceYaw(tharsisDir);
    const tharsisPitch = faceLat(tharsisDir);

    let currentSiteIdx = 0;
    const destName = document.getElementById('destName');
    const sitesUl = document.getElementById('sites');

    // Build timeline items
    SITES.forEach((site, i) => {
      const li = document.createElement('li');
      li.dataset.i = i;
      li.textContent = site.name;
      if (i === 0) li.classList.add('on');
      sitesUl.appendChild(li);
    });

    function pick(i) {
      currentSiteIdx = i;
      const items = sitesUl.querySelectorAll('li');
      items.forEach((item, idx) => {
        item.classList.toggle('on', idx === i);
      });

      const s = SITES[i];
      destName.textContent = s.name;
      const reg = document.getElementById('region');
      if (reg) reg.textContent = s.name.toUpperCase();

      // Card crop
      const [bx, by, bw, bh] = s.box;
      const bgW = (SHEET.w / bw) * 100;
      const bgH = (SHEET.h / bh) * 100;
      const bgX = (bx / (SHEET.w - bw)) * 100;
      const bgY = (by / (SHEET.h - bh)) * 100;
      elCard.style.backgroundSize = `${bgW}% ${bgH}%`;
      elCard.style.backgroundPosition = `${bgX}% ${bgY}%`;

      // Vertical position of card aligning center with item
      const activeLi = items[i];
      if (activeLi && window.innerWidth > 880) {
        const rect = activeLi.getBoundingClientRect();
        const top = rect.top + rect.height / 2 - elCard.offsetHeight / 2;
        elCard.style.top = `${top}px`;
      }
    }

    // Mathematical helpers
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const seg = (p, a, b) => clamp((p - a) / (b - a));
    const io = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const out = (k) => 1 - Math.pow(1 - k, 3);
    const mix = (x, y, a) => x + (y - x) * a;

    // Viewport & layout dimensions
    let W = window.innerWidth;
    let H = window.innerHeight;
    let portrait = H > W * 1.05;
    let R0 = portrait ? W * 0.36 : Math.min(H * 0.31, W * 0.20);

    // State flow
    let st = 0;
    let from = 0;
    let to = 0;
    let t0 = 0;
    let dur = 1300;
    let loadTime = null;

    function go(n) {
      if (n === to) return;
      from = st;
      to = clamp(n, 0, 2);
      t0 = performance.now();
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        dur = 1;
      } else {
        if ((from <= 0 && to >= 2) || (from >= 2 && to <= 0)) {
          dur = 3800;
        } else if ((from >= 1 && to >= 2) || (from >= 2 && to >= 1)) {
          dur = 2500;
        } else {
          dur = 1300;
        }
      }
      wheelLockUntil = performance.now() + 1400;
    }

    // Wheel trigger
    let wheelLockUntil = 0;
    window.addEventListener('wheel', (e) => {
      const now = performance.now();
      if (now < wheelLockUntil) return;
      if (Math.abs(e.deltaY) > 8) {
        if (e.deltaY > 0 && to < 2) {
          go(to + 1);
        } else if (e.deltaY < 0 && to > 0) {
          go(to - 1);
        }
      }
    }, { passive: true });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && to > 0) go(to - 1);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        if (to < 2) go(to + 1);
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (to > 0) go(to - 1);
      }
    });

    // Toast feedback helper
    const toast = document.getElementById('toast');
    let toastTimeout;
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3400);
    }

    // Three.js Setup
    const canvasGL = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvasGL,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H);

    const camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -2e5, 2e5);
    camera.position.z = 1000;
    const scene = new THREE.Scene();

    const planet = new THREE.Group();
    const tilt = new THREE.Group();
    const spin = new THREE.Group();
    scene.add(planet);
    planet.add(tilt);
    tilt.add(spin);

    // Planet Shader Uniforms with higher vividness & contrast
    const planetUniforms = {
      map: { value: null },
      texel: { value: new THREE.Vector2(1 / 2688, 1 / 1344) },
      sun: { value: new THREE.Vector3(0.65, 0.48, 0.58).normalize() },
      hiDir: { value: tharsisDir.clone() },
      hi: { value: 0 },
      hiR: { value: 0.62 },
      ready: { value: 0.0 }
    };

    const planetGeo = new THREE.SphereGeometry(1, 128, 96);
    const planetMat = new THREE.ShaderMaterial({
      uniforms: planetUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vObj;
        varying vec3 vN;
        void main(){
          vUv = uv;
          vObj = normalize(position);
          vN = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform vec2 texel;
        uniform vec3 sun, hiDir;
        uniform float hi, hiR, ready;
        varying vec2 vUv;
        varying vec3 vObj;
        varying vec3 vN;
        float luma(vec2 u){ return dot(texture2D(map, u).rgb, vec3(.3,.6,.1)); }
        void main(){
          vec3 rawCol = texture2D(map, vUv).rgb;
          // Punchy saturation and contrast
          vec3 col = pow(rawCol, vec3(2.3)) * vec3(1.3, 0.76, 0.54);
          vec3 n = normalize(vN);
          vec3 t = normalize(cross(vec3(0.,1.,0.), n));
          vec3 b = cross(n, t);
          float dx = luma(vUv + vec2(texel.x*2.,0.)) - luma(vUv - vec2(texel.x*2.,0.));
          float dy = luma(vUv + vec2(0.,texel.y*2.)) - luma(vUv - vec2(0.,texel.y*2.));
          n = normalize(n - (t*dx + b*dy) * 2.2);
          
          float diff = max(dot(n, sun), 0.);
          // Specular rim punch
          vec3 halfVec = normalize(sun + vec3(0., 0., 1.));
          float spec = pow(max(dot(n, halfVec), 0.), 18.0) * 0.42;

          vec3 lit = col * (vec3(1.7, 1.42, 1.25) * pow(diff, 0.82) + vec3(0.18, 0.07, 0.04));
          lit += vec3(1.0, 0.7, 0.45) * spec;

          // Territory glow with ultra high contrast crimson
          float d = acos(clamp(dot(normalize(vObj), hiDir), -1., 1.)) + (luma(vUv) - .45) * .22;
          float m = smoothstep(hiR, hiR - .03, d);
          float edge = smoothstep(.03, .0, abs(d - hiR + .01));
          vec3 crimson = vec3(0.92, 0.04, 0.12) * (0.35 + diff * 1.25) * (0.55 + luma(vUv) * 1.2);
          lit = mix(lit, mix(lit, crimson, 0.94), m * hi) + vec3(1.0, 0.48, 0.45) * edge * hi * 0.45;
          
          // Enhanced limb fresnel
          float fres = pow(1. - max(vN.z, 0.), 3.0);
          lit += vec3(1.0, 0.62, 0.32) * fres * (0.08 + diff * 0.7);
          
          // Tone & contrast mapping
          lit = lit / (lit * 0.22 + 0.95) * 1.4;
          gl_FragColor = vec4(pow(lit, vec3(1.0 / 2.15)), 1.) * ready;
        }
      `
    });

    const planetMesh = new THREE.Mesh(planetGeo, planetMat);
    spin.add(planetMesh);

    // High brightness glowing atmosphere
    const atmoUniforms = {
      sun: { value: new THREE.Vector3(0.65, 0.48, 0.58).normalize() },
      ready: { value: 0.0 }
    };
    const atmoGeo = new THREE.SphereGeometry(1.16, 64, 48);
    const atmoMat = new THREE.ShaderMaterial({
      uniforms: atmoUniforms,
      vertexShader: `
        varying vec3 vN;
        void main(){
          vN = normalize(mat3(modelMatrix)*normal);
          gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
        }
      `,
      fragmentShader: `
        uniform vec3 sun;
        uniform float ready;
        varying vec3 vN;
        void main(){
          float z = clamp(-vN.z, 0., 1.);
          float a = smoothstep(0.0, 0.52, z);
          float s = 0.65 + 0.75 * max(dot(-vN * vec3(1.,1.,0.), normalize(sun * vec3(1.,1.,0.))), 0.);
          a = pow(a, 2.4) * s * 0.88;
          vec3 atmoCol = mix(vec3(1.0, 0.5, 0.22), vec3(1.0, 0.82, 0.55), s * 0.5);
          gl_FragColor = vec4(atmoCol, a * ready);
        }
      `,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
    planet.add(atmoMesh);

    // Map texture loading & seam/pole processing canvas
    const imgMap = new Image();
    imgMap.crossOrigin = 'anonymous';
    imgMap.src = MAP;
    imgMap.onload = () => {
      const W_TEX = 2688;
      const H_TEX = 1344;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = W_TEX;
      offCanvas.height = H_TEX;
      const ctx = offCanvas.getContext('2d');

      ctx.drawImage(imgMap, 0, 0, W_TEX, H_TEX);

      const fw = Math.round(W_TEX * 0.07);
      const tempC = document.createElement('canvas');
      tempC.width = fw;
      tempC.height = H_TEX;
      const tCtx = tempC.getContext('2d');
      tCtx.drawImage(offCanvas, 0, 0, fw, H_TEX, 0, 0, fw, H_TEX);

      tCtx.globalCompositeOperation = 'destination-in';
      const seamGrad = tCtx.createLinearGradient(0, 0, fw, 0);
      seamGrad.addColorStop(0, 'rgba(0,0,0,0)');
      seamGrad.addColorStop(1, 'rgba(0,0,0,1)');
      tCtx.fillStyle = seamGrad;
      tCtx.fillRect(0, 0, fw, H_TEX);

      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(tempC, W_TEX - fw, 0);

      // Clean poles
      const ph = Math.round(H_TEX * 0.035);
      const topGrad = ctx.createLinearGradient(0, 0, 0, ph);
      topGrad.addColorStop(0, '#ebdcd0');
      topGrad.addColorStop(1, 'rgba(235,220,208,0)');
      ctx.fillStyle = topGrad;
      ctx.fillRect(0, 0, W_TEX, ph);

      const botGrad = ctx.createLinearGradient(0, H_TEX - ph, 0, H_TEX);
      botGrad.addColorStop(0, 'rgba(235,220,208,0)');
      botGrad.addColorStop(1, '#ebdcd0');
      ctx.fillStyle = botGrad;
      ctx.fillRect(0, H_TEX - ph, W_TEX, ph);

      const tex = new THREE.CanvasTexture(offCanvas);
      tex.colorSpace = THREE.NoColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.needsUpdate = true;

      planetUniforms.map.value = tex;
      planetUniforms.ready.value = 1.0;
      atmoUniforms.ready.value = 1.0;
      loadTime = performance.now();
    };

    // Dust 2D Canvas setup
    const dustCanvas = document.getElementById('dust');
    const dustCtx = dustCanvas.getContext('2d');
    const dprDust = Math.min(window.devicePixelRatio || 1, 1.5);
    function resizeDust() {
      dustCanvas.width = W * dprDust;
      dustCanvas.height = H * dprDust;
    }
    resizeDust();

    // High brightness dust sprite
    const spriteSize = 64;
    const spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = spriteSize;
    spriteCanvas.height = spriteSize;
    const sCtx = spriteCanvas.getContext('2d');
    const rad = sCtx.createRadialGradient(spriteSize / 2, spriteSize / 2, 0, spriteSize / 2, spriteSize / 2, spriteSize / 2);
    rad.addColorStop(0, 'rgba(255,245,220,1.0)');
    rad.addColorStop(0.35, 'rgba(255,190,120,0.6)');
    rad.addColorStop(0.8, 'rgba(255,120,50,0.15)');
    rad.addColorStop(1, 'rgba(255,120,50,0)');
    sCtx.fillStyle = rad;
    sCtx.fillRect(0, 0, spriteSize, spriteSize);

    // Seeded dust motes
    const DUST_COUNT = 36;
    const motes = [];
    let seed = 42;
    function rnd() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }
    for (let i = 0; i < DUST_COUNT; i++) {
      motes.push({
        x: rnd(),
        y: rnd(),
        r: 3 + Math.pow(rnd(), 2) * 34,
        s: 0.004 + rnd() * 0.012,
        p: rnd() * 6.28
      });
    }

    // Interactive pointer, touch & drag physics
    let yaw = faceYaw(mapDir(0.4, 0.5));
    let pitch = 0.16;
    let vy = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let ptrDownX = 0;
    let ptrDownY = 0;
    let lastDragTime = -9999;
    let targetMouseX = 0;
    let targetMouseY = 0;
    let smoothMouseX = 0;
    let smoothMouseY = 0;

    let curCx = W / 2;
    let curCy = H / 2;
    let curR = R0;

    function onPointerMove(clientX, clientY) {
      targetMouseX = clientX / W - 0.5;
      targetMouseY = clientY / H - 0.5;
      if (isDragging) {
        const dx = clientX - dragStartX;
        const dy = clientY - dragStartY;
        dragStartX = clientX;
        dragStartY = clientY;
        const k = 1.1 / R0;
        yaw += dx * k;
        pitch = clamp(pitch + dy * k, -1, 1);
        vy = dx * k * 0.35;
        lastDragTime = performance.now();
      }
    }

    window.addEventListener('pointermove', (e) => onPointerMove(e.clientX, e.clientY));

    canvasGL.addEventListener('pointerdown', (e) => {
      if (st >= 1.02) return;
      isDragging = true;
      canvasGL.classList.add('drag');
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      ptrDownX = e.clientX;
      ptrDownY = e.clientY;
      vy = 0;
      lastDragTime = performance.now();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      canvasGL.classList.remove('drag');
      const dist = Math.hypot(e.clientX - ptrDownX, e.clientY - ptrDownY);
      if (dist < 6) {
        const clickDist = Math.hypot(e.clientX - curCx, e.clientY - curCy);
        if (clickDist <= curR && to < 2) {
          go(to + 1);
        }
      }
    });

    // Touch gesture enhancements
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const diffY = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(diffY) > 55) {
          if (diffY > 0 && to < 2) go(to + 1);
          if (diffY < 0 && to > 0) go(to - 1);
        }
      }
    }, { passive: true });

    // Sites interaction
    sitesUl.addEventListener('mouseover', (e) => {
      const li = e.target.closest('li');
      if (li && li.dataset.i !== undefined) {
        pick(parseInt(li.dataset.i, 10));
      }
    });
    sitesUl.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (li && li.dataset.i !== undefined) {
        pick(parseInt(li.dataset.i, 10));
        go(2);
      }
    });

    document.getElementById('explore').addEventListener('click', (e) => {
      e.preventDefault();
      go(2);
    });
    document.getElementById('home').addEventListener('click', (e) => {
      e.preventDefault();
      go(0);
    });

    // Booking actions
    const bookBtn = document.getElementById('bookBtn');
    bookBtn.addEventListener('click', () => {
      const site = SITES[currentSiteIdx].name;
      const d1 = document.getElementById('d1').value;
      const passengers = document.getElementById('d3').value;
      showToast(`Reserved ${passengers} to ${site} for departure on ${d1}!`);
    });

    document.getElementById('loginLink').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Redline Astronaut Portal is opening...');
    });
    document.getElementById('signupLink').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Priority Mars 2041 waiting list opened!');
    });
    document.getElementById('srchBtn').addEventListener('click', () => {
      go(1);
      showToast('Explore landing territories across Mars.');
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      showToast('Redline Mission Status: All systems nominal.');
    });

    // Rail dots
    const railBtns = document.querySelectorAll('#rail button');
    railBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => go(idx));
    });

    // Window Resize Handling
    function handleResize() {
      W = window.innerWidth;
      H = window.innerHeight;
      portrait = H > W * 1.05;
      R0 = portrait ? W * 0.36 : Math.min(H * 0.31, W * 0.20);
      renderer.setSize(W, H);
      camera.left = -W / 2;
      camera.right = W / 2;
      camera.top = H / 2;
      camera.bottom = -H / 2;
      camera.updateProjectionMatrix();
      resizeDust();
      pick(currentSiteIdx);
    }
    window.addEventListener('resize', handleResize);

    // Initial setup
    pick(0);

    // Animation frame timing
    let lastTime = performance.now();

    function render(now) {
      requestAnimationFrame(render);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const t = now * 0.001;

      // Mouse smoothing for silky parallax
      smoothMouseX += (targetMouseX - smoothMouseX) * (1 - Math.exp(-dt * 8));
      smoothMouseY += (targetMouseY - smoothMouseY) * (1 - Math.exp(-dt * 8));

      // State interpolation
      if (dur > 0 && to !== from) {
        const p = seg(now, t0, t0 + dur);
        st = mix(from, to, io(p));
      } else {
        st = to;
      }

      const a = clamp(st, 0, 1);
      const b = clamp(st - 1, 0, 1);

      // Intro progression
      const age = loadTime ? (now - loadTime) * 0.001 : 0;
      const grow = out(seg(age, 0, 1.5));
      const iw = out(seg(age, 0.75, 1.7));

      // Layout & Planet geometry
      const bz = io(seg(b, 0, 0.62));
      const px = portrait ? 0.5 * W : mix(0.5 * W, 0.36 * W, a);
      const py = portrait ? mix(0.4 * H, 0.33 * H, a) : 0.5 * H;
      const R = R0 * mix(0.03, 1, grow) * (1 + a * 0.04) * Math.exp(bz * 2.5);
      const cx = mix(px, 0.5 * W, bz);
      const cy = mix(py, 0.5 * H, bz);

      curCx = cx;
      curCy = cy;
      curR = R;

      planet.position.set(cx - W / 2, H / 2 - cy, 0);
      planet.scale.set(R, R, R);

      // Rotation choreography
      const siteDir = mapDir(SITES[currentSiteIdx].u, SITES[currentSiteIdx].v);
      const targetDir = b > 0 ? siteDir : tharsisDir;
      const targetYaw = faceYaw(targetDir);
      const targetLat = faceLat(targetDir);

      if (st < 0.02) {
        if (!isDragging && (now - lastDragTime > 1500)) {
          yaw += dt * (0.08 + (1 - grow) * 2.4);
        }
        if (!isDragging) {
          yaw += vy;
          vy *= Math.exp(-dt * 4);
          pitch += (0.16 - pitch) * (1 - Math.exp(-dt * 1.2));
        }
      } else {
        if (!isDragging) {
          // Shortest arc yaw ease
          let diffYaw = (targetYaw - yaw) % (Math.PI * 2);
          if (diffYaw > Math.PI) diffYaw -= Math.PI * 2;
          if (diffYaw < -Math.PI) diffYaw += Math.PI * 2;
          yaw += diffYaw * (1 - Math.exp(-dt * 3.6));
          pitch += (targetLat - pitch) * (1 - Math.exp(-dt * 3.6));
        }
      }

      tilt.rotation.x = pitch;
      spin.rotation.y = yaw;

      // Highlight uniform updates
      const hiDirTarget = b > 0.02 ? siteDir : tharsisDir;
      planetUniforms.hiDir.value.copy(hiDirTarget);
      planetUniforms.hiR.value = b > 0.02 ? mix(0.62, 0.3, seg(b, 0, 0.1)) : 0.62;
      planetUniforms.hi.value = clamp(seg(a, 0.15, 0.6) + (b > 0 ? 1 : 0), 0, 1);

      // DOM Elements updates
      const word0 = document.getElementById('word0');
      const eyebrow = document.getElementById('eyebrow');
      const flare = document.getElementById('flare');
      const hint = document.getElementById('hint');
      const pin = document.getElementById('pin');
      const word1 = document.getElementById('word1');
      const sites = document.getElementById('sites');
      const card = document.getElementById('card');
      const region = document.getElementById('region');
      const fog = document.getElementById('fog');
      const dest = document.getElementById('dest');
      const bar = document.getElementById('bar');
      const scrim = document.getElementById('scrim');

      // word0
      const w0OffsetX = portrait ? 0 : -a * 0.08 * W;
      const w0OffsetY = portrait ? (H * -0.1 + R * 1.08 + word0.offsetHeight * 0.5) : (smoothMouseY * -8);
      const I = (1 - iw) * 50;
      word0.style.transform = `translate(calc(-50% + ${w0OffsetX}px), calc(-50% + ${w0OffsetY}px))`;
      word0.style.clipPath = `inset(-10% ${I}% -10% ${I}%)`;
      word0.style.opacity = 1 - seg(a, 0.1, 0.5);

      // eyebrow
      const w0Width = word0.offsetWidth || 400;
      const w0Height = word0.offsetHeight || 100;
      const eyeX = portrait ? 'calc(-50%)' : `calc(-50% + ${w0OffsetX - w0Width * 0.5 + w0Width * 0.02}px)`;
      const eyeY = portrait ? `calc(-50% + ${w0OffsetY + w0Height * 0.5 + 24}px)` : `calc(-50% + ${w0OffsetY - (w0Height * 0.5 + 34)}px)`;
      eyebrow.style.transform = `translate(${eyeX}, ${eyeY})`;
      eyebrow.style.opacity = iw * (1 - seg(a, 0.05, 0.35));

      // flare
      flare.style.left = `${cx + R * 0.74}px`;
      flare.style.top = `${cy - R * 0.62}px`;
      flare.style.opacity = grow * (0.88 + 0.12 * Math.sin(t * 1.3)) * (1 - seg(bz, 0, 0.35));

      // hint
      hint.style.opacity = iw * 0.85 * (1 - seg(a, 0, 0.25));

      // pin (project Tharsis point)
      const thVec = tharsisDir.clone();
      thVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      thVec.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
      pin.style.transform = `translate(${cx + thVec.x * R - 6}px, ${cy - thVec.y * R - 8}px)`;
      const pinOp = seg(thVec.z, 0.22, 0.42) * seg(age, 1.6, 2.1) * (1 - seg(a, 0, 0.3));
      pin.style.opacity = pinOp;

      // word1
      const ka = seg(a, 0.45, 1);
      const w1X = portrait ? 0 : (0.02 * W + (1 - out(ka)) * 40);
      const w1Y = portrait ? 0.46 * H : 0.56 * H;
      word1.style.transform = `translate(calc(-50% + ${w1X}px), -50%)`;
      word1.style.top = `${w1Y}px`;
      word1.style.opacity = ka * (1 - seg(b, 0.02, 0.16));

      // sites + card
      const sitesOp = seg(a, 0.55, 1) * (1 - seg(b, 0, 0.14));
      sites.style.opacity = sitesOp;
      card.style.opacity = sitesOp;
      sites.style.display = sitesOp < 0.001 ? 'none' : 'grid';
      card.style.display = sitesOp < 0.001 ? 'none' : 'block';
      sites.style.pointerEvents = sitesOp < 0.6 ? 'none' : 'auto';
      card.style.pointerEvents = sitesOp < 0.6 ? 'none' : 'auto';
      card.style.transform = `translateX(${(1 - out(seg(a, 0.6, 1))) * 26}px)`;

      // gl canvas pointer events
      canvasGL.style.pointerEvents = st < 1.02 ? 'auto' : 'none';

      // region
      region.style.opacity = seg(b, 0.14, 0.26) * (1 - seg(b, 0.42, 0.52));

      // fog
      const fi = seg(b, 0.36, 0.54);
      const fo = seg(b, 0.62, 0.96);
      fog.style.opacity = fi * (1 - fo);

      // Landing layers with high-contrast parallax
      const lk = out(seg(b, 0.5, 1));
      const fk = out(seg(b, 0.58, 1));
      const dk = out(seg(b, 0.66, 0.98));
      const drift = 1 + 0.025 * Math.sin(t * 0.18);

      elLand.style.display = b > 0.5 ? 'block' : 'none';
      elFore.style.display = b > 0.5 ? 'block' : 'none';
      dest.style.display = b > 0.5 ? 'block' : 'none';

      elLand.style.transform = `translate(${smoothMouseX * -18}px, ${mix(0.2 * H, smoothMouseY * -10, lk)}px) scale(${mix(1.3, 1.05, lk) * drift})`;
      elFore.style.transform = `translate(${smoothMouseX * -54}px, ${mix(0.42 * H, 0, fk)}px) scale(1.06)`;
      const destEndY = portrait ? 0.3 * H : 0.27 * H;
      dest.style.transform = `translate(${smoothMouseX * -30}px, ${mix(0.62 * H, destEndY, dk)}px)`;
      const destSmall = dest.querySelector('small');
      if (destSmall) {
        destSmall.style.opacity = seg(b, 0.8, 1) * 0.95;
      }

      // booking bar
      const bk = seg(b, 0.86, 1);
      bar.style.opacity = bk;
      bar.style.transform = `translate(-50%, ${(1 - out(bk)) * 34}px)`;
      bar.style.pointerEvents = bk > 0.5 ? 'auto' : 'none';

      // scrim
      scrim.style.opacity = seg(b, 0.6, 0.9);

      // rail
      const activeRailIdx = Math.round(st);
      railBtns.forEach((btn, idx) => {
        btn.classList.toggle('on', idx === activeRailIdx);
      });

      // Render Three.js scene
      renderer.render(scene, camera);

      // Render Dust Canvas with enhanced luminosity
      dustCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
      const dustAlphaMul = b > 0.5 ? 0.75 : 1.1;
      for (let i = 0; i < DUST_COUNT; i++) {
        const m = motes[i];
        const mx = (((m.x + t * m.s + 2) % 1.1) - 0.05) * dustCanvas.width;
        const my = (m.y + Math.sin(t * 0.3 + m.p) * 0.02) * dustCanvas.height;
        const alpha = (0.35 + 0.45 * Math.pow(Math.sin(t * 0.7 + m.p), 2)) * dustAlphaMul;
        const radius = m.r * dprDust;

        dustCtx.save();
        dustCtx.globalAlpha = Math.min(1.0, alpha);
        dustCtx.drawImage(spriteCanvas, mx - radius, my - radius, radius * 2, radius * 2);
        dustCtx.restore();
      }
    }

    // Start loop
    window.onload = () => {
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
